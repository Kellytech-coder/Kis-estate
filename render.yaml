services:
  - type: web
    name: kis-estate-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://kis-estate.vercel.app
      - key: FIREBASE_PROJECT_ID
        value: property-listing-5df59
      - key: FIREBASE_STORAGE_BUCKET
        value: property-listing-5df59.firebasestorage.app
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
